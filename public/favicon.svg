<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1E293B"/>
  <!-- Outer glow ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.4"/>
  <!-- Checkmark -->
  <polyline points="10,16 14,20.5 22,11" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sparkle top-right -->
  <circle cx="25" cy="7" r="1" fill="#93C5FD" opacity="0.9"/>
  <line x1="25" y1="5" x2="25" y2="9" stroke="#93C5FD" stroke-width="0.8" opacity="0.7"/>
  <line x1="23" y1="7" x2="27" y2="7" stroke="#93C5FD" stroke-width="0.8" opacity="0.7"/>
</svg>
